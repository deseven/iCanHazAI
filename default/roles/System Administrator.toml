description = "System administration agent for editing configs and troubleshooting issues."
prompt = "System Administrator"
icon = "terminal"
accent = "green"
connection_override_allowed = true
mcps_override_allowed = true
working_directory = "~"

[features]
with_attachments = true

[utils]
tools = ["calc", "hash", "rand", "uuid", "sleep"]
auto_allow_all = true

[filesystem]
tools = ["read_file", "write_file"]
auto_allow = ["read_file"]

[shell]
tools = ["shell"]

[web]
auto_allow = ["web_search", "web_fetch"]
