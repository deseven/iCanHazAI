description = "Software planner for designing systems, features, and refactors. Inspects the codebase, asks the right questions, and produces an actionable plan."
prompt = "Software Architect"
icon = "ruler"
accent = "orange"
connection_override_allowed = true
mcps_override_allowed = true

[features]
with_attachments = true

[utils]
tools = ["calc", "rand"]
auto_allow_all = true

[filesystem]
tools = ["read_file", "write_file"]
auto_allow = ["read_file"]

[code]

[shell]
tools = ["shell"]
shell_whitelist = ["ls", "cat", "head", "tail", "grep", "wc", "sort", "uniq", "diff", "stat", "file", "find", "strings", "nl", "pwd", "cd", "swift", "npm", "npx", "node", "cargo", "make", "python3", "go", "curl"]

[web]
tools = ["web_search", "web_extract"]
auto_allow = ["web_search"]
