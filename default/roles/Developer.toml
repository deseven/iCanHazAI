description = "Unrestricted coding agent equipped with all essential tools for code generation and testing."
prompt = "Developer"
icon = "hammer"
accent = "blue"

[features]
with_attachments = true

[utils]
tools = ["calc", "rand", "uuid"]
auto_allow_all = true

[filesystem]
tools = ["ls", "read_file", "write_file", "find_file", "find_text"]
auto_allow = ["ls", "read_file", "find_file", "find_text"]

[edit]

[shell]
tools = ["shell"]
shell_whitelist = ["ls", "cat", "head", "tail", "grep", "wc", "sort", "uniq", "diff", "stat", "file", "find:read", "sed:read", "git:read", "echo", "strings", "nl", "pwd", "cd", "swift", "npm", "npx", "node", "cargo", "make", "python3", "go", "curl"]

[web]
tools = ["web_search", "web_extract"]
auto_allow = ["web_search"]
