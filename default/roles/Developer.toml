description = "Unrestricted coding agent equipped with all essential tools for code generation and testing."
prompt = "Developer"
icon = "hammer"
accent = "blue"
connection_override_allowed = true
mcps_override_allowed = true

[features]
with_attachments = true

[utils]
tools = ["calc", "hash", "rand", "uuid", "sleep"]
auto_allow_all = true

[filesystem]
tools = ["read_file", "write_file"]
auto_allow = ["read_file"]

[code]

[shell]
tools = ["shell"]

[web]
auto_allow = ["web_search", "web_fetch"]
